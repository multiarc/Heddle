{# Idiomatic Askama stat partial (WI5, README D8/Q1.7; ledger E20). One of the four
   dispatched fragment kinds (Askama book: "Template syntax - Include"). #}

  <span class="stat-name">{{ item.name }}</span>
  <span class="stat-value">{{ item.value }}</span>
  <span class="stat-delta">{{ item.delta }}</span>
</div>
