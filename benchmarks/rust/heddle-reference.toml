# Heddle reference wall-time values for the `summarize` tool (Phase 2 spec, README D13).
#
# Schema (normative):
#   pending    = bool     # true while the Phase 1 protocol run is unpublished (SR-6)
#   source-run = string   # date of the published Phase 1 protocol run, e.g. "2026-08-01"
#   [workloads]           # workload id -> Heddle wall time in ns/render, transcribed once
#   <workload-id> = <ns>  # from the published Phase 1 run and reviewed in diff
#
# STANDING RULING SR-6 (2026-07-21) — DISCHARGED 2026-07-25. The ruling held while the Phase 1
# protocol run was unpublished: this file carried the schema but no values, and `pending = true`
# made `summarize` fail loudly ("reference pending the Phase 1 protocol run") rather than emit
# tables with fabricated Heddle numbers. The cross-stack run published at
# `docs/benchmarks/2026-07-22/` is that protocol run — its .NET anchor measured all eight
# workloads on the protocol machine in the same session as phases 2-6 — so the values below are
# now transcribed from it and `pending` is false.
#
# Provenance: each value is the BenchmarkDotNet `Mean` of `RenderHeddle` from
# `docs/benchmarks/2026-07-22/dotnet/results/Heddle.Performance.<Suite>RenderBenchmarks-report.csv`,
# converted to ns/render (the only arithmetic applied). The harness dispersion published
# alongside these figures is BDN's `Error` and `StdDev`, quoted in the comments below.
# Suite mapping is pinned in metrics-protocol.md; do not re-derive it here.

pending = false
source-run = "2026-07-22"

[workloads]
composed-page = 25310.0         # 25.31 μs  (Error 0.545 μs, StdDev 1.607 μs)  TextRenderBenchmarks
trivial-substitution = 113.6    # 113.6 ns  (Error 0.67 ns,   StdDev 0.52 ns)  SubstitutionRenderBenchmarks
large-loop = 514700.0           # 514.7 μs  (Error 5.18 μs,   StdDev 4.84 μs)  LoopRenderBenchmarks
mixed-page = 2601.0             # 2.601 μs  (Error 0.0515 μs, StdDev 0.0670 μs) MixedRenderBenchmarks
conditional-heavy = 13970.0     # 13.97 μs  (Error 0.039 μs,  StdDev 0.030 μs) ConditionalRenderBenchmarks
fragment-heavy = 2880.0         # 2.880 μs  (Error 0.0556 μs, StdDev 0.0682 μs) FragmentRenderBenchmarks
fortunes-encoded = 669.0        # 669.0 ns  (Error 4.24 ns,   StdDev 3.31 ns)  FortunesRenderBenchmarks
encoded-loop = 1988000.0        # 1.988 ms  (Error 0.0364 ms, StdDev 0.0340 ms) EncodedLoopRenderBenchmarks
