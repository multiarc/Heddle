<!--/*
  Idiomatic Thymeleaf authoring — official doc citations:
  https://www.thymeleaf.org/doc/tutorials/3.1/usingthymeleaf.html
    §5.2 (setting specific attributes: th:href, th:class), §6 (iteration: th:each),
    §7.1 (simple conditionals: th:if/th:unless), §8.1 (defining/including fragments),
    §8.2 (fragment signatures and parameters), §8.3 (flexible layouts: the layout
    fragment takes the page body as a fragment-expression parameter and inserts it
    with th:replace="${bodySlot}"), §11.4 (synthetic th:block), §12 (unescaped
    text: th:utext)

  Definition-only layout: rendering this template whole is never done — pages select
  the layout(bodySlot) fragment. The full literal page chrome lives inside it
  (all literal text lives in templates), the section defaults and the nav fragments
  are siblings a page could override by passing/selecting alternatives, and the
  structured navigation renders through nested parameterized fragments
  (mega_menu → nav_column → nav_section → nav_link). Checked by the functional
  verifier, not the byte gate.
*/-->
<th:block th:fragment="meta_section">
    <title>Title</title>
</th:block>
<th:block th:fragment="socialmeta">
    <meta property="og:image" content="/files/catalog/img.jpg">
    <meta itemprop="image" content="/files/catalog/img.jpg"/>
    <link rel="image_src" href="/files/catalog/img.jpg"/>
</th:block>
<th:block th:fragment="page_scripts"></th:block>
<th:block th:fragment="endpage_scripts"></th:block>

<li class="nav-link" th:fragment="nav_link(link)"><a th:href="${link.href}" th:utext="${link.label}">link label</a></li>

<div class="nav-section" th:fragment="nav_section(section)">
    <span class="nav-title" th:if="${section.titleLinked}"><a th:href="${section.href}" th:utext="${section.title}">section title</a></span>
    <span class="nav-title" th:unless="${section.titleLinked}" th:utext="${section.title}">section title</span>
    <ul>
        <th:block th:each="link : ${section.links}">
            <li th:replace="~{idiomatic/shared/layout :: nav_link(${link})}">nav link</li>
        </th:block>
    </ul>
</div>

<div class="nav-column" th:fragment="nav_column(column)">
    <th:block th:each="section : ${column.sections}">
        <div th:replace="~{idiomatic/shared/layout :: nav_section(${section})}">nav section</div>
    </th:block>
</div>

<div class="top-menu-wrapper" th:fragment="mega_menu(menu)">
    <ul class="top-menu">
        <li th:each="tab : ${menu.tabs}" th:class="${tab.css}">
            <a th:href="${tab.href}" class="drop" th:utext="${tab.label}">tab label</a>
            <div th:if="${tab.hasDropdown}" th:class="${tab.dropdownCss}">
                <th:block th:each="column : ${tab.columns}">
                    <div th:replace="~{idiomatic/shared/layout :: nav_column(${column})}">nav column</div>
                </th:block>
            </div>
        </li>
    </ul>
</div>

<th:block th:fragment="layout(bodySlot)"><!DOCTYPE html>
<!--[if lt IE 9]>
    <html class="no-js lt-ie9" lang="en">
<![endif]-->
<!--[if gte IE 9]>
    <html class="no-js" lang="en">
<![endif]-->
<!--[if !IE]><!-->
<html class="no-js" lang="en">
<!--<![endif]-->
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <th:block th:replace="~{idiomatic/shared/layout :: meta_section}"/>
    <th:block th:replace="~{idiomatic/shared/layout :: socialmeta}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="msvalidate.01" content="4A9D524947EE62F01A1A9607511248C4" />
    <link href="//fonts.googleapis.com/css?family=Francois+One" rel="stylesheet" type="text/css">
    <link rel="apple-touch-icon" href="/assets/miscellaneous/apple-touch-icon.png">
    <link rel="icon" type="img/ico" href="/assets/miscellaneous/favicon.ico">
    <th:block th:replace="~{idiomatic/shared/chrome-fragments :: assets_styles}"/>
    <th:block th:replace="~{idiomatic/shared/chrome-fragments :: custom_styles}"/>
    <th:block th:replace="~{idiomatic/shared/chrome-fragments :: head_scripts}"/>
</head>
<body>
    <th:block th:replace="~{idiomatic/shared/chrome-fragments :: body_scripts}"/>
    <div>
        <div class="header-top main">
            <div class="header-top-right">
                <div class="actions-top-nav">
                    <a href="/index/profile">Your Account</a>
                    <a href="/Account/Register">Register</a>
                    <a class="last-child" href="/content/contact-customer-service">Contact Us</a>
                </div>
            </div>
        </div>
    </div>
    <div class="separator-top"></div>
    <div class="alert-banner">
        <div th:replace="~{idiomatic/shared/chrome-fragments :: alert_top}">alert banner</div>
    </div>
    <div class="main">
        <header>
            <div class="header-main">
                <div class="logo-holder">
                    <a href="/">
                    </a>
                </div>
                <div class="header-right-sidebar">
                    <div class="search-area">
                        <form id="search-area-form" action="/help/search" method="get">
                            <input type="text" name="q" value="What can we help you find?" onclick="this.value = ( this.value == this.defaultValue ) ? '' : this.value;return true;" dir="ltr" autocomplete="off" spellcheck="false" style="outline: none;">

                            <input type="image" class="not-active" src="/Assets/images/mag-off.png" />
                        </form>
                    </div>
                    <div class="header-actions-holder">
                        <div class="cart-work-area">

                                <div class="cart-icon"></div>

            <nav class="hide top-nav secondary-nav">

                <ul th:replace="~{idiomatic/shared/chrome-fragments :: secondary_retail_menu}">retail menu</ul>
            </nav>
            <th:block th:each="menu : ${nav.menus}">
                <div th:replace="~{idiomatic/shared/layout :: mega_menu(${menu})}">mega menu</div>
            </th:block>
        </header>
        <div class="content">
            <div class="alert-banner">
                <th:block th:replace="~{idiomatic/shared/chrome-fragments :: alert_below}"/>
            </div>
            <div class="content-dynamic">
                <th:block th:replace="${bodySlot}"/>
            </div>
            <div class="content-bottom">
            </div>
        </div>
        <footer>
            <div class="footer-main">
                <nav class="footer-nav">
                    <th:block th:each="column : ${nav.footerColumns}">
                        <div th:replace="~{idiomatic/shared/layout :: nav_column(${column})}">footer column</div>
                    </th:block>
                </nav>
                <div class="footer-market">

                        </div>
                        <div class="clear"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <th:block th:replace="~{idiomatic/shared/chrome-fragments :: assets_scripts}"/>
    <script src="/app/modules/profile/gccheckform.js"></script>
    <th:block th:replace="~{idiomatic/shared/layout :: page_scripts}"/>
    <th:block th:replace="~{idiomatic/shared/layout :: endpage_scripts}"/>
    <th:block th:replace="~{idiomatic/shared/chrome-fragments :: body_end_scripts}"/>
</body>
</html></th:block>
