<th:block th:fragment="meta_section">
    <title>Title</title>
</th:block>
<th:block th:fragment="socialmeta">
    <meta property="og:image" content="/files/catalog/img.jpg">
    <meta itemprop="image" content="/files/catalog/img.jpg"/>
    <link rel="image_src" href="/files/catalog/img.jpg"/>
</th:block>
<th:block th:fragment="page_scripts"></th:block>
<th:block th:fragment="endpage_scripts"></th:block>
<th:block th:fragment="nav_link(link)"><li class="nav-link"><a th:attr="href=${link.href}">[(${link.label})]</a></li></th:block>
<th:block th:fragment="nav_section(section)"><div class="nav-section"><th:block th:switch="${true}"><th:block th:case="${section.titleLinked}"><span class="nav-title"><a th:attr="href=${section.href}">[(${section.title})]</a></span></th:block><th:block th:case="*"><span class="nav-title">[(${section.title})]</span></th:block></th:block><ul><th:block th:each="link : ${section.links}"><th:block th:replace="~{controlled/layout :: nav_link(${link})}"/></th:block></ul></div></th:block>
<th:block th:fragment="nav_column(column)"><div class="nav-column"><th:block th:each="section : ${column.sections}"><th:block th:replace="~{controlled/layout :: nav_section(${section})}"/></th:block></div></th:block>
<th:block th:fragment="mega_menu(menu)"><div class="top-menu-wrapper"><ul class="top-menu"><th:block th:each="tab : ${menu.tabs}"><li th:attr="class=${tab.css}"><a th:attr="href=${tab.href},class='drop'">[(${tab.label})]</a><th:block th:if="${tab.hasDropdown}"><div th:attr="class=${tab.dropdownCss}"><th:block th:each="column : ${tab.columns}"><th:block th:replace="~{controlled/layout :: nav_column(${column})}"/></th:block></div></th:block></li></th:block></ul></div></th:block>
<th:block th:fragment="layout(bodySlot)"><!DOCTYPE html>
<!--[if lt IE 9]>
    <html class="no-js lt-ie9" lang="en">
<![endif]-->
<!--[if gte IE 9]>
    <html class="no-js" lang="en">
<![endif]-->
<!--[if !IE]><!-->
<html class="no-js" lang="en">
<!--<![endif]-->
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <th:block th:replace="~{controlled/layout :: meta_section}"/>
    <th:block th:replace="~{controlled/layout :: socialmeta}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="msvalidate.01" content="4A9D524947EE62F01A1A9607511248C4" />
    <link href="//fonts.googleapis.com/css?family=Francois+One" rel="stylesheet" type="text/css">
    <link rel="apple-touch-icon" href="/assets/miscellaneous/apple-touch-icon.png">
    <link rel="icon" type="img/ico" href="/assets/miscellaneous/favicon.ico">
    <th:block th:replace="~{controlled/chrome-fragments :: assets_styles}"/>
    <th:block th:replace="~{controlled/chrome-fragments :: custom_styles}"/>
    <th:block th:replace="~{controlled/chrome-fragments :: head_scripts}"/>
</head>
<body>
    <th:block th:replace="~{controlled/chrome-fragments :: body_scripts}"/>
    <div>
        <div class="header-top main">
            <div class="header-top-right">
                <div class="actions-top-nav">
                    <a href="/index/profile">Your Account</a>
                    <a href="/Account/Register">Register</a>
                    <a class="last-child" href="/content/contact-customer-service">Contact Us</a>
                </div>
            </div>
        </div>
    </div>
    <div class="separator-top"></div>
<div class="alert-banner">
    <th:block th:replace="~{controlled/chrome-fragments :: alert_top}"/>
</div>
    <div class="main">
        <header>
            <div class="header-main">
                <div class="logo-holder">
                    <a href="/">
                    </a>
                </div>
                <div class="header-right-sidebar">
                    <div class="search-area">
                        <form id="search-area-form" action="/help/search" method="get">
                            <input type="text" name="q" value="What can we help you find?" onclick="this.value = ( this.value == this.defaultValue ) ? '' : this.value;return true;" dir="ltr" autocomplete="off" spellcheck="false" style="outline: none;">
                            <input type="image" class="active" style="display: none;" src="/Assets/images/mag.jpg" />
                            <input type="image" class="not-active" src="/Assets/images/mag-off.png" />
                        </form>
                    </div>
                    <div class="header-actions-holder">
                        <div class="cart-work-area">
                            <a class="view-cart" href="#">
                                <div class="cart-icon"></div>
                                <div class="item-total">
                                    <span id="cart-lite-component"></span>
                                    <span>Item(s)</span>
                                </div>
                            </a>
                            <a class="checkout-button" href="#">
                                <button>CHECKOUT</button>
                            </a>
                        </div>
                    </div>
                    <div class="clear"></div>
                    <div class="header-top-right">
                        <div class="actions-top-nav">
                            <a class="wholesale-home" href="/products/wholesale">Wholesale Home</a>
                        </div>
                    </div>
                </div>
            </div>
            <nav class="hide top-nav secondary-nav">
                <th:block th:replace="~{controlled/chrome-fragments :: secondary_wholesale_menu}"/>
                <th:block th:replace="~{controlled/chrome-fragments :: secondary_retail_menu}"/>
            </nav>
            <th:block th:each="menu : ${nav.menus}"><th:block th:replace="~{controlled/layout :: mega_menu(${menu})}"/></th:block>
        </header>
        <div class="content">
            <div class="alert-banner">
                <th:block th:replace="~{controlled/chrome-fragments :: alert_below}"/>
            </div>
            <div class="content-dynamic">
                <th:block th:replace="${bodySlot}"/>
            </div>
            <div class="content-bottom">
            </div>
        </div>
        <footer>
            <div class="footer-main">
                <nav class="footer-nav">
                    <th:block th:each="column : ${nav.footerColumns}"><th:block th:replace="~{controlled/layout :: nav_column(${column})}"/></th:block>
                </nav>
                <div class="footer-market">
                    <div class="market-left">
                        <a href="/content/request-catalog">
                            <img alt="See Our Catalog" src="/Assets/images/seeourcatalog.jpg" />
                        </a>
                    </div>
                    <div class="market-right">
                        <div class="ssl-area">
                        </div>
                        <div id="socialiconshome-102413">
                            <img src="/Assets/images/socialicons5-home.jpg" usemap="#Social">
                        </div>
                        <div class="clear"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <th:block th:replace="~{controlled/chrome-fragments :: assets_scripts}"/>
    <script src="/app/modules/profile/gccheckform.js"></script>
    <th:block th:replace="~{controlled/layout :: page_scripts}"/>
    <th:block th:replace="~{controlled/layout :: endpage_scripts}"/>
    <th:block th:replace="~{controlled/chrome-fragments :: body_end_scripts}"/>
</body>
</html></th:block>
