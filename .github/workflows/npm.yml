# Builds the custom Ace editor bundle (@multiarc/ace_heddle) and publishes it to the
# public npm registry (npmjs.org) using npm Trusted Publishing (OIDC) — no NPM_TOKEN.
#   - pull requests            -> build only; nothing is published anywhere
#   - tag vX.Y.Z (on main)     -> `npm publish` X.Y.Z, dist-tag "latest"
#   - tag vX.Y.Z-beta.N        -> `npm publish` X.Y.Z-beta.N, dist-tag "beta" (likewise alpha, rc)
#
# Publishing is TAG-DRIVEN; the tag rules live in release-tag.yml. Merging to main does not publish.
#
# Building is a separate job from publishing: the build holds no publishing credentials, and
# each publish starts from an artifact that is already known to have built cleanly.

name: Heddle Ace (npm)

on:
  push:
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Build custom Ace bundle
      working-directory: src/Heddle.Language
      run: bash build_ace.sh
    - name: Stage package manifest with built bundle
      working-directory: src/Heddle.Language
      run: cp package.json ace_build/ace/build/package.json
    - uses: actions/upload-artifact@v7
      with:
        name: ace-bundle
        path: src/Heddle.Language/ace_build/ace/build
        if-no-files-found: error

  # What this ref publishes, if anything: see release-tag.yml.
  release-tag:
    uses: ./.github/workflows/release-tag.yml
    permissions:
      contents: read

  # The bundle this package ships is what the JS editor-artifact harness covers, and that harness
  # runs in the Release suites. Gate the publish on it: a tag must not ship over a red suite.
  release-tests:
    needs: release-tag
    if: ${{ needs.release-tag.outputs.is_tag == 'true' }}
    uses: ./.github/workflows/tests-release.yml
    permissions:
      contents: read

  publish-release:
    needs: [ build, release-tag, release-tests ]
    if: ${{ needs.release-tag.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    # Same environment as the nuget.org and Marketplace publishes: which refs may publish is one setting.
    # This changes the OIDC subject claim to repo:<owner>/<repo>:environment:marketplace, so npm's
    # Trusted Publishing policy must name this environment too.
    environment: marketplace
    permissions:
      contents: read
      id-token: write   # OIDC token for npm Trusted Publishing
    steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        scope: '@multiarc'
    - uses: actions/download-artifact@v7
      with:
        name: ace-bundle
        path: ace-bundle
    # The dist-tag is explicit: a pre-release goes to alpha, beta or rc and never moves "latest"
    # (npm also refuses to publish a pre-release version without --tag).
    - name: Publish release package
      working-directory: ace-bundle
      env:
        VERSION: ${{ needs.release-tag.outputs.version }}
        CHANNEL: ${{ needs.release-tag.outputs.channel }}
      run: |
        npm version --no-git-tag-version --allow-same-version "$VERSION"
        npm publish --tag "$CHANNEL"
