# Build/test on every push and PR. Internal PRs publish beta prereleases to nuget.org.
# Production releases are TAG-DRIVEN: push a `vX.Y.Z` tag and CI publishes that exact
# version to nuget.org (as latest) and creates a GitHub Release. Merging to main does NOT
# publish — it only builds/tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Heddle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

# Default token is read-only. Fork PRs only ever get this; publish jobs grant
# themselves the extra scope they need.
permissions:
  contents: read

# The build matrix includes windows-latest, where the default shell is pwsh. The test steps
# below are bash, and a bash-only line there fails the step rather than running the tests.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    # Every leg goes through the same wrapper, which fails unless the suite's real number of tests
    # ran. Each project is named explicitly: `dotnet test` under Microsoft.Testing.Platform takes
    # --project or --solution, and a whole-solution run would report one aggregate floor rather than
    # one per suite, which is what makes a single suite going quiet visible.
    - name: Test engine suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh 2134 src/Heddle.Tests/Heddle.Tests.csproj -c Debug --no-restore
    - name: Test generator suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh 611 src/Heddle.Generator.Tests/Heddle.Generator.Tests.csproj -c Debug --no-restore
    - name: Test generator integration suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh 1122 src/Heddle.Generator.IntegrationTests/Heddle.Generator.IntegrationTests.csproj -c Debug --no-restore
    - name: Test language services suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh 205 src/Heddle.LanguageServices.Tests/Heddle.LanguageServices.Tests.csproj -c Debug --no-restore
    - name: Test tool suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh 6 src/Heddle.Tool.Tests/Heddle.Tool.Tests.csproj -c Debug --no-restore
    # The generator suites had no Release leg, and the engine's `#if DEBUG` arms are reachable from them:
    # a Release-only failure in the integration suite survived because every run above it was Debug.
    # Reuses the Release build already produced by the Build step, the same way the LSP workflow does.
    - name: Test generator suite (Release)
      run: .github/scripts/dotnet-test-guarded.sh 611 src/Heddle.Generator.Tests/Heddle.Generator.Tests.csproj -c Release --no-build
    - name: Test generator integration suite (Release)
      run: .github/scripts/dotnet-test-guarded.sh 1122 src/Heddle.Generator.IntegrationTests/Heddle.Generator.IntegrationTests.csproj -c Release --no-build

  # Every commit in a contributed pull request must carry its Signed-off-by before anything
  # built from it is published. Releases from main are not gated — they are the maintainer's
  # own, and a tag push carries no pull request to check.
  dco:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/dco.yml
    permissions:
      contents: read

  # Internal (non-fork) pull requests publish a beta prerelease to nuget.org.
  # Packing is separated from pushing: this job produces the packages and holds no
  # publishing credentials, so a build failure cannot happen mid-publish.
  prerelease-pack:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    # No `dotnet build --no-build` split here: Heddle.Tool / Heddle.LanguageServer are RID-specific
    # .NET tools (PackAsTool + multiple RuntimeIdentifiers), so `dotnet pack` must publish each RID.
    # A RID-less `dotnet build` never produces those per-RID outputs, so `--no-build` fails with
    # MSB3030 (missing per-RID assemblies) / NETSDK1085. Let pack build+publish, like the release job.
    # The suffix carries NO leading dash: since Q8.11 the version is one <VersionPrefix> in Directory.Build.props and
    # the SDK joins prefix and suffix with a single '-', so "-beta.N" would compose 2.1.0--beta.N. It was harmless only
    # while every project spelled `2.0.0$(VersionSuffix)` by hand. Pinned by VersionConsistencyTests.
    - name: Pack beta packages
      run: dotnet pack -c Release -o ${{ runner.temp }}/pkg --version-suffix "beta.${{ github.run_number }}"
    - uses: actions/upload-artifact@v7
      with:
        name: nupkg-beta
        path: ${{ runner.temp }}/pkg/*.nupkg
        if-no-files-found: error

  prerelease-publish:
    needs: [ prerelease-pack, dco ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for nuget.org Trusted Publishing
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - uses: actions/download-artifact@v7
      with:
        name: nupkg-beta
        path: ${{ runner.temp }}/pkg
    - name: NuGet login (OIDC -> short-lived API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push beta to nuget.org
      run: dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Production release: triggered by pushing a `vX.Y.Z` tag. Publishes that exact version
  # (becomes "latest" on nuget.org automatically) and creates a GitHub Release.
  release-pack:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json
    - name: Resolve version from tag
      id: ver
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
    - name: Restore dependencies
      run: dotnet restore
    - name: Pack release packages
      run: dotnet pack -c Release -p:Version=${{ steps.ver.outputs.version }} -o ${{ runner.temp }}/pkg
    - uses: actions/upload-artifact@v7
      with:
        name: nupkg-release
        path: ${{ runner.temp }}/pkg/*.nupkg
        if-no-files-found: error

  release-publish:
    needs: release-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # OIDC token for nuget.org Trusted Publishing
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - uses: actions/download-artifact@v7
      with:
        name: nupkg-release
        path: ${{ runner.temp }}/pkg
    - name: NuGet login (OIDC -> short-lived API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push release to nuget.org
      # No --skip-duplicate: a release of an already-published version must fail loudly.
      run: dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
