# Build/test/pack on every push and PR. Pull requests and main never publish anything.
# Publishing is TAG-DRIVEN (rules in release-tag.yml): a `vX.Y.Z` tag on main publishes that
# exact version to nuget.org (as latest) and creates a GitHub Release; a `vX.Y.Z-alpha.N`,
# `-beta.N` or `-rc.N` tag, from any branch, publishes a nuget.org pre-release and a GitHub
# pre-release.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Heddle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

# Default token is read-only. Fork PRs only ever get this; publish jobs grant
# themselves the extra scope they need.
permissions:
  contents: read

# The build matrix includes windows-latest, where the default shell is pwsh. The test steps
# below are bash, and a bash-only line there fails the step rather than running the tests.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    # Every leg goes through the same wrapper, which turns a skipped test into a failed one and calls
    # out the platform's zero-tests-discovered exit. Each project is named explicitly: `dotnet test`
    # under Microsoft.Testing.Platform takes --project or --solution, and a whole-solution run would
    # report one aggregate result rather than one per suite, which is what makes a single suite going
    # quiet visible. What each suite CONTAINS is gated inside the suite, by its checked-in
    # src/<Suite>/test-classes.txt inventory; no test count is maintained here.
    - name: Test engine suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Tests/Heddle.Tests.csproj -c Debug --no-restore
    - name: Test language services suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh src/Heddle.LanguageServices.Tests/Heddle.LanguageServices.Tests.csproj -c Debug --no-restore
    - name: Test tool suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Tool.Tests/Heddle.Tool.Tests.csproj -c Debug --no-restore
    - name: Test build suite (Debug)
      run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Build.Tests/Heddle.Build.Tests.csproj -c Debug --no-restore

  # Packs every package, so a pack failure shows up on the pull request rather than at release time.
  # Nothing is uploaded or pushed; this job holds no credentials and runs for forks too.
  pack:
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    # No `dotnet build --no-build` split here: Heddle.Tool / Heddle.LanguageServer are RID-specific
    # .NET tools (PackAsTool + multiple RuntimeIdentifiers), so `dotnet pack` must publish each RID.
    # A RID-less `dotnet build` never produces those per-RID outputs, so `--no-build` fails with
    # MSB3030 (missing per-RID assemblies) / NETSDK1085. Let pack build+publish, like the release job.
    - name: Pack packages
      run: dotnet pack -c Release -o ${{ runner.temp }}/pkg

  # What this ref publishes, if anything: see release-tag.yml.
  release-tag:
    uses: ./.github/workflows/release-tag.yml
    permissions:
      contents: read

  # The release gates. The Debug suites in `build` are not the whole contract: testing-standards.md
  # requires the Release leg too, and the samples are the engine's end-to-end integration tests.
  # Both used to run only in other workflows, which no publish awaited, so a tag could publish over
  # a red Release suite or a broken sample. They run here only for a tag.
  release-tests:
    needs: release-tag
    if: ${{ needs.release-tag.outputs.is_tag == 'true' }}
    uses: ./.github/workflows/tests-release.yml
    permissions:
      contents: read

  release-samples:
    needs: release-tag
    if: ${{ needs.release-tag.outputs.is_tag == 'true' }}
    uses: ./.github/workflows/samples.yml
    permissions:
      contents: read

  # Release or pre-release: triggered by pushing a release tag. Publishes that exact version
  # (a release becomes "latest" on nuget.org, a suffixed version is a nuget.org pre-release)
  # and creates the matching GitHub Release.
  release-pack:
    needs: [ build, release-tag, release-tests, release-samples ]
    if: ${{ needs.release-tag.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Pack release packages
      run: dotnet pack -c Release -p:Version=${{ needs.release-tag.outputs.version }} -o ${{ runner.temp }}/pkg
    - uses: actions/upload-artifact@v7
      with:
        name: nupkg-release
        path: ${{ runner.temp }}/pkg/*.nupkg
        if-no-files-found: error

  release-publish:
    needs: [ release-pack, release-tag ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # OIDC token for nuget.org Trusted Publishing
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - uses: actions/download-artifact@v7
      with:
        name: nupkg-release
        path: ${{ runner.temp }}/pkg
    - name: NuGet login (OIDC -> short-lived API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push release to nuget.org
      # No --skip-duplicate: a release of an already-published version must fail loudly.
      run: dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ needs.release-tag.outputs.prerelease }}
      run: |
        flags=()
        if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
        gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
