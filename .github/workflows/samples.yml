# Integration demo gallery: every sample is a CI job with golden assertions.
# A red job here is an integration regression in the owning phase's feature.
name: Heddle Samples

on:
  push:
    branches: [ "main" ]
    paths:
      - 'samples/**'
      - 'src/**'
      - '.github/workflows/samples.yml'
  pull_request:
    branches: [ "main" ]
    paths:                          # identical list, repeated verbatim — path filters
      - 'samples/**'                # are per-trigger; keep both lists in sync
      - 'src/**'
      - '.github/workflows/samples.yml'

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false          # one broken sample must not mask the others
      matrix:
        sample:
          - ssr-aspnetcore
          - definition-library
          - dynamic-models
          - sandboxed-user-templates
          - html-safe-output
          - custom-extensions
          - component-props-slots
          - streaming-ssr
          - precompiled-app
          - precompiled-aot
          - codegen-t4-successor
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Comparer self-test
      run: bash samples/tools/compare-golden-selftest.sh
    - name: Run sample (capture mode)
      run: dotnet run --project samples/${{ matrix.sample }} -c Release -- --capture out
    - name: Compare against goldens
      run: bash samples/tools/compare-golden.sh samples/${{ matrix.sample }}

  # The NativeAOT claim, verified on the artifact that makes it: the sample is built (the build-time
  # host is an executable, which a self-contained publish cannot reference, so publish is a second
  # step over an up-to-date build), published as a native linux-x64 binary, and that binary captures
  # and compares against the same goldens the JIT run above compares against.
  aot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Native toolchain
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Build
      run: dotnet build samples/precompiled-aot -c Release
    - name: Publish native binary
      run: dotnet publish samples/precompiled-aot -c Release -r linux-x64 --no-build
    - name: Run the published binary (capture mode)
      working-directory: samples/precompiled-aot
      run: ./bin/Release/net10.0/linux-x64/publish/PrecompiledAot --capture out
    - name: Compare against goldens
      run: bash samples/tools/compare-golden.sh samples/precompiled-aot
