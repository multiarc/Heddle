# Builds and tests the Heddle language services (facade + LSP server), packs the version-pinned
# per-RID dotnet tool, and packages the VS Code extension. Phase 6 (editor tooling / LSP).
#
# Marketplace publishing is TAG-DRIVEN, like the NuGet and npm workflows: a `vX.Y.Z` tag publishes
# every per-target VSIX to the Visual Studio Marketplace under the `multiarc` publisher. The
# credential is the VSCE_PAT secret on the `marketplace` environment; see marketplace-publish for
# why it is a token and not OIDC.

name: Heddle LSP

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# The test job runs on windows-latest, where the default shell is pwsh; the steps below are bash.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The multi-targeted test suite runs net8.0/net10.0/net48; the runner image may drop the
          # .NET 8 runtime, so install it explicitly alongside the global.json SDK — otherwise the
          # net8.0 test host aborts (NETCore.App 8 missing).
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Build (Release)
        run: dotnet build -c Release Heddle.sln
      # Same wrapper the dotnet workflow uses; these two legs once had no guard at all.
      # This runner is Windows, so Heddle.Tests also builds its net48 leg and runs every TFM.
      - name: Test engine suite
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Tests/Heddle.Tests.csproj -c Release --no-build
      - name: Test language services
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.LanguageServices.Tests/Heddle.LanguageServices.Tests.csproj -c Release --no-build
      # The Release legs of the tool and build suites (phase-4 testing plan): the same wrapper, so
      # every suite has both configurations on the record.
      - name: Test tool suite
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Tool.Tests/Heddle.Tool.Tests.csproj -c Release --no-build
      - name: Test build suite
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Build.Tests/Heddle.Build.Tests.csproj -c Release --no-build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: JS editor-artifact harness (highlight / beautify / completions)
        working-directory: src/Heddle.Language
        run: |
          npm ci
          npm test

  pack-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
        # Framework-dependent + R2R per-RID packs cross-pack from one runner (phase 6 D19).
        # -p:EnableToolR2R=true makes PublishReadyToRun visible at the RID-less outer restore so
        # the crossgen2 runtime packs for every RuntimeIdentifier are restored (else NETSDK1094).
      - name: Pack heddle-lsp (manifest + per-RID + any)
        run: dotnet pack src/Heddle.LanguageServer/Heddle.LanguageServer.csproj -c Release -o ./nupkg -p:EnableToolR2R=true
      - name: Smoke — install and run --version
        run: |
          set -euo pipefail
          dotnet tool install --global Heddle.LanguageServer --add-source ./nupkg --version 3.0.0 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          heddle-lsp --version
      - uses: actions/upload-artifact@v7
        with:
          name: heddle-lsp-nupkg
          path: ./nupkg/*.nupkg

  vsix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [win32-x64, win32-arm64, linux-x64, linux-arm64, alpine-x64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Map VS Code target to .NET RID
        id: rid
        run: |
          case "${{ matrix.target }}" in
            win32-x64)   echo "rid=win-x64" >> "$GITHUB_OUTPUT" ;;
            win32-arm64) echo "rid=win-arm64" >> "$GITHUB_OUTPUT" ;;
            linux-x64)   echo "rid=linux-x64" >> "$GITHUB_OUTPUT" ;;
            linux-arm64) echo "rid=linux-arm64" >> "$GITHUB_OUTPUT" ;;
            alpine-x64)  echo "rid=linux-musl-x64" >> "$GITHUB_OUTPUT" ;;
            darwin-x64)  echo "rid=osx-x64" >> "$GITHUB_OUTPUT" ;;
            darwin-arm64) echo "rid=osx-arm64" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publish server (framework-dependent, R2R)
        run: dotnet publish src/Heddle.LanguageServer/Heddle.LanguageServer.csproj -c Release -r ${{ steps.rid.outputs.rid }} --self-contained false -o editors/vscode/server -p:EnableToolR2R=true
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run copy-grammar
          npx @vscode/vsce package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: heddle-vsix-${{ matrix.target }}
          path: editors/vscode/*.vsix

  # Production release of the extension: every per-target VSIX the matrix above built for this tag,
  # published in one job. Packaging is separated from publishing exactly as in dotnet.yml: this job
  # starts from artifacts that are already known to have built, and only this job sees the token.
  #
  # Why a token and not OIDC like the NuGet and npm jobs: the Marketplace's GitHub Trusted
  # Publishing is still being built (microsoft/vsmarketplace#1422, staff 2026-09-14) and the Entra
  # alternative needs an Azure subscription. VSCE_PAT is an Azure DevOps personal access token
  # (organization "All accessible organizations", scope Marketplace: Manage) stored as a secret on
  # the `marketplace` environment, so no other job can read it. When Trusted Publishing ships, this
  # becomes `vsce publish --oidc` with `id-token: write` and the secret goes away.
  marketplace-publish:
    needs: [ test, vsix ]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: heddle-vsix-*
          path: vsix
          merge-multiple: true
      # vsce comes from the extension's own lock file, so the version that publishes is the one the
      # VSIXs were packaged with. verify-pat fails before any upload if the token is expired or is
      # not a member of the publisher.
      - name: Verify publisher access
        working-directory: editors/vscode
        run: |
          npm ci
          npx @vscode/vsce verify-pat multiarc
      # No --skip-duplicate: a release of an already-published version must fail loudly (dotnet.yml).
      # The seven VSIXs share one version; the Marketplace lists them as one extension.
      - name: Publish to the Visual Studio Marketplace
        working-directory: editors/vscode
        run: npx @vscode/vsce publish --packagePath ../vsix/*.vsix
