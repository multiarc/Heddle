# The Release leg: all four suites in Release plus the JS editor-artifact harness, on Windows.
#
# It lives in its own callable workflow because it is a RELEASE GATE, not only a pull-request check.
# GitHub Actions jobs can only depend on jobs in their own workflow, so every workflow that publishes
# calls this one and makes its publishing job depend on it — otherwise a tag could publish while the
# Release suites are red, which is what happened before (they ran in lsp.yml, which no publish awaited).
#
# testing-standards.md requires both configurations: Debug runs per push in dotnet.yml, Release here.

name: Release suites

on:
  workflow_call:

permissions:
  contents: read

# This job runs on windows-latest, where the default shell is pwsh; the steps below are bash.
defaults:
  run:
    shell: bash

jobs:
  suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The multi-targeted test suite runs net8.0/net10.0/net48; the runner image may drop the
          # .NET 8 runtime, so install it explicitly alongside the global.json SDK — otherwise the
          # net8.0 test host aborts (NETCore.App 8 missing).
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Build (Release)
        run: dotnet build -c Release Heddle.sln
      # Same wrapper the dotnet workflow uses; these two legs once had no guard at all.
      # This runner is Windows, so Heddle.Tests also builds its net48 leg and runs every TFM.
      - name: Test engine suite
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Tests/Heddle.Tests.csproj -c Release --no-build
      - name: Test language services
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.LanguageServices.Tests/Heddle.LanguageServices.Tests.csproj -c Release --no-build
      # The Release legs of the tool and build suites (phase-4 testing plan): the same wrapper, so
      # every suite has both configurations on the record.
      - name: Test tool suite
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Tool.Tests/Heddle.Tool.Tests.csproj -c Release --no-build
      - name: Test build suite
        run: .github/scripts/dotnet-test-guarded.sh src/Heddle.Build.Tests/Heddle.Build.Tests.csproj -c Release --no-build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: JS editor-artifact harness (highlight / beautify / completions)
        working-directory: src/Heddle.Language
        run: |
          npm ci
          npm test
